<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API 交互接口站点</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #121a33;
      --panel: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.12);
      --text: #eaf0ff;
      --muted: #94a3c4;
      --accent: #4f8cff;
      --accent-2: #38e1c3;
      --radius: 20px;
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(79, 140, 255, 0.22), transparent 60%),
        radial-gradient(1000px 520px at 100% 110%, rgba(56, 225, 195, 0.16), transparent 60%),
        linear-gradient(160deg, var(--bg), var(--bg-soft));
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 52px 44px 44px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 沿卡片边框轨迹循环运动的光线：光头亮点 + 光段拖尾 */
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    /* 光头 */
    .card::before {
      z-index: 2;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f2fffc;
      box-shadow:
        0 0 8px 2px rgba(202, 255, 245, 0.95),
        0 0 20px 6px rgba(56, 225, 195, 0.50),
        0 0 42px 14px rgba(79, 140, 255, 0.22);
      animation: card-light-head 4.8s linear infinite;
    }

    /* 光段拖尾（亮端与光头重合，拖尾在运动方向后方） */
    .card::after {
      z-index: 1;
      width: 96px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(79, 140, 255, 0.15) 30%,
        rgba(56, 225, 195, 0.85) 75%,
        #eafffb 100%);
      filter: blur(0.4px);
      /* 旋转原点固定为光段亮端（右边缘中点），保证亮端始终贴合光头 */
      transform-origin: 100% 50%;
      animation: card-light-tail 4.8s linear infinite;
    }

    @keyframes card-light-head {
      0%   { left: 0;     top: 0;     transform: translate(-50%, -50%); }
      25%  { left: 100%;  top: 0;     transform: translate(-50%, -50%); }
      50%  { left: 100%;  top: 100%;  transform: translate(-50%, -50%); }
      75%  { left: 0;     top: 100%;  transform: translate(-50%, -50%); }
      100% { left: 0;     top: 0;     transform: translate(-50%, -50%); }
    }

    @keyframes card-light-tail {
      0%     { left: 0;     top: 0;     transform: translate(-96px, -1px) rotate(0deg); }
      25%    { left: 100%;  top: 0;     transform: translate(-96px, -1px) rotate(0deg); }
      25.01% {                          transform: translate(-96px, -1px) rotate(90deg); }
      50%    { left: 100%;  top: 100%;  transform: translate(-96px, -1px) rotate(90deg); }
      50.01% {                          transform: translate(-96px, -1px) rotate(180deg); }
      75%    { left: 0;     top: 100%;  transform: translate(-96px, -1px) rotate(180deg); }
      75.01% {                          transform: translate(-96px, -1px) rotate(270deg); }
      100%   { left: 0;     top: 0;     transform: translate(-96px, -1px) rotate(270deg); }
    }

    .illustration {
      width: 100%;
      max-width: 320px;
      height: auto;
      margin-bottom: 30px;
      display: block;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin: 0 0 16px;
      font-weight: 600;
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(56, 225, 195, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4.4vw, 38px);
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.01em;
      background: linear-gradient(120deg, #ffffff, #b9ccff 55%, #7ff0db);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p.subtitle {
      margin: 18px 0 0;
      font-size: clamp(14px, 2.2vw, 16px);
      line-height: 1.7;
      color: var(--muted);
      max-width: 46ch;
    }

    .endpoint {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 12px;
      background: rgba(79, 140, 255, 0.10);
      border: 1px solid rgba(79, 140, 255, 0.30);
      font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
      font-size: clamp(12px, 2vw, 14px);
      color: #cfe0ff;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .endpoint .method {
      color: var(--accent-2);
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .status {
      margin-top: 26px;
      font-size: 13px;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .status .pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent-2);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .github-link {
      position: absolute;
      right: 22px;
      bottom: 22px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: var(--muted);
      border: 1px solid var(--border);
      background: rgba(18, 26, 51, 0.72);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      transition: color .2s ease, border-color .2s ease,
                  background .2s ease, transform .2s ease;
    }

    .github-link:hover {
      color: var(--text);
      border-color: rgba(79, 140, 255, 0.5);
      background: rgba(79, 140, 255, 0.12);
      transform: translateY(-2px);
    }

    .github-icon {
      width: 21px;
      height: 21px;
      display: block;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .status .pulse { animation: none; }
      .card::before,
      .card::after { animation: none; }
    }

    @media (max-width: 520px) {
      .card { padding: 40px 24px 32px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- SVG 插画：API 接口交互（请求 / 响应） -->
    <svg class="illustration" viewBox="0 0 320 220" role="img"
         aria-label="API 交互接口示意图：客户端与服务器之间通过接口交换数据"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gAccent" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4f8cff"/>
          <stop offset="100%" stop-color="#38e1c3"/>
        </linearGradient>
        <linearGradient id="gLine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="#7fb0ff" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#38e1c3" stop-opacity="0.15"/>
        </linearGradient>
      </defs>

      <!-- 顶部装饰圆点 -->
      <circle cx="160" cy="26" r="26" fill="url(#gAccent)" opacity="0.10"/>
      <circle cx="160" cy="26" r="14" fill="url(#gAccent)" opacity="0.20"/>
      <circle cx="160" cy="26" r="6" fill="url(#gAccent)"/>

      <!-- 连接线 -->
      <path d="M160 34 L160 78" stroke="url(#gLine)" stroke-width="2"
            stroke-linecap="round" stroke-dasharray="6 6"/>
      <path d="M160 142 L160 186" stroke="url(#gLine)" stroke-width="2"
            stroke-linecap="round" stroke-dasharray="6 6"/>

      <!-- 中心：接口节点 -->
      <rect x="104" y="78" width="112" height="64" rx="16"
            fill="rgba(79,140,255,0.10)" stroke="url(#gAccent)" stroke-width="2"/>
      <text x="160" y="112" text-anchor="middle" dominant-baseline="middle"
            font-family="monospace" font-size="15" font-weight="700" fill="#eaf0ff">
        API
      </text>

      <!-- 左侧：客户端卡片 -->
      <g>
        <rect x="26" y="86" width="60" height="48" rx="12"
              fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
        <rect x="38" y="98" width="36" height="5" rx="2.5" fill="#8fb3ff" opacity="0.85"/>
        <rect x="38" y="110" width="24" height="5" rx="2.5" fill="#8fb3ff" opacity="0.5"/>
      </g>

      <!-- 右侧：服务器卡片 -->
      <g>
        <rect x="234" y="86" width="60" height="48" rx="12"
              fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
        <rect x="246" y="98" width="36" height="5" rx="2.5" fill="#7ff0db" opacity="0.9"/>
        <rect x="246" y="110" width="26" height="5" rx="2.5" fill="#7ff0db" opacity="0.55"/>
      </g>

      <!-- 双向箭头 -->
      <path d="M90 104 L100 110 L90 116" fill="none" stroke="#7fb0ff"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M230 104 L220 110 L230 116" fill="none" stroke="#38e1c3"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- 底部：数据流节点 -->
      <g>
        <circle cx="96" cy="196" r="11" fill="rgba(79,140,255,0.14)"
                stroke="#4f8cff" stroke-width="1.6"/>
        <circle cx="160" cy="200" r="14" fill="rgba(56,225,195,0.14)"
                stroke="#38e1c3" stroke-width="1.6"/>
        <circle cx="224" cy="196" r="11" fill="rgba(79,140,255,0.14)"
                stroke="#4f8cff" stroke-width="1.6"/>
      </g>
      <path d="M106 196 L146 200" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
      <path d="M174 200 L214 196" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
    </svg>

    <span class="eyebrow"><span class="dot"></span>API ENDPOINT</span>

    <h1>此为 api 交互接口站点</h1>

    <p class="subtitle">
      本页面用于承载与后端服务的接口交互，通过标准化的请求与响应完成数据交换。
    </p>

    <!-- <div class="endpoint">
      <span class="method">POST</span>
      <span>/api/v1/interact</span>
    </div> -->

    <div class="status"><span class="pulse"></span>接口服务运行中</div>

    <a class="github-link" href="https://github.com/supbose/api"
       target="_blank" rel="noopener noreferrer" aria-label="访问 GitHub 仓库">
      <svg class="github-icon" viewBox="0 0 24 24" fill="currentColor"
           aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
      </svg>
    </a>
  </main>
</body>
</html>
